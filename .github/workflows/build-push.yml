name: Build, Push and Deploy

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  REGISTRY: clementaksterraform.azurecr.io
  IMAGE_NAME: aks-platform
  RESOURCE_GROUP: rg-aks-terraform
  AKS_CLUSTER: aks-terraform-platform

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: |
          az acr login --name clementaksterraform

      - name: Build Docker image
        run: |
          docker build \
            -t $REGISTRY/$IMAGE_NAME:${{ github.sha }} \
            -t $REGISTRY/$IMAGE_NAME:latest \
            ./app

      - name: Push Docker image
        run: |
          docker push $REGISTRY/$IMAGE_NAME:${{ github.sha }}
          docker push $REGISTRY/$IMAGE_NAME:latest

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group $RESOURCE_GROUP \
            --name $AKS_CLUSTER \
            --overwrite-existing

      - name: Deploy with Helm
        run: |
          helm upgrade --install aks-platform ./helm/aks-platform \
            --namespace aks-platform \
            --create-namespace \
            --set image.repository=$REGISTRY/$IMAGE_NAME \
            --set image.tag=${{ github.sha }} \
            --set image.pullPolicy=Always

      - name: Wait for rollout
        run: |
          kubectl rollout status \
            deployment/aks-platform \
            --namespace aks-platform \
            --timeout=180s

      - name: Verify deployment
        run: |
          kubectl get pods -n aks-platform
          kubectl get ingress -n aks-platform