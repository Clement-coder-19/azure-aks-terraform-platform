replicaCount: 1

image:
  repository: clementaksterraform.azurecr.io/aks-platform
  tag: "latest"
  pullPolicy: Always

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

ingress:
  enabled: true
  className: nginx
  host: aks-platform.local

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPU: 70

workloadIdentity:
  enabled: true
  serviceAccountName: aks-platform-workload
  clientId: ""